name: PR Scanning

on:
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:

  plan-simple-api:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: setup node js
        uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: npm
          cache-dependency-path: simpleapi/package-lock.json

      - name: Install CI
        run: npm ci
        working-directory: simpleapi

      - name: Validate Eslint
        run: npm run lint
        working-directory: simpleapi

      - name: Build the package
        run: npm run build
        working-directory: simpleapi


